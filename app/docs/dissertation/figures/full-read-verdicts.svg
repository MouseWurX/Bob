<svg xmlns='http://www.w3.org/2000/svg' width='760' height='400' viewBox='0 0 760 400' font-family='Helvetica, Arial, sans-serif'>
<rect width='760' height='400' fill='#fcfcfb'/>
<text x='24' y='36' font-size='19' font-weight='600' fill='#0b0b0b'>What a full read found, as shares of each set</text>
<text x='24' y='60' font-size='14' fill='#52514e'>Verdict on every item. Tool lessons read by Opus; held-out items sorted by Haiku with a 5% Opus check.</text>
<rect x='24.0' y='75.0' width='12.0' height='12.0' rx='2' fill='#2a78d6'/>
<text x='42.0' y='85.0' font-size='12' fill='#52514e' text-anchor='start'>Keep as written</text>
<rect x='162.0' y='75.0' width='12.0' height='12.0' rx='2' fill='#94bdec'/>
<text x='180.0' y='85.0' font-size='12' fill='#52514e' text-anchor='start'>Fix</text>
<rect x='213.6' y='75.0' width='12.0' height='12.0' rx='2' fill='#eb6834'/>
<text x='231.6' y='85.0' font-size='12' fill='#52514e' text-anchor='start'>Repair</text>
<rect x='286.8' y='75.0' width='12.0' height='12.0' rx='2' fill='#a9a7a1'/>
<text x='304.8' y='85.0' font-size='12' fill='#52514e' text-anchor='start'>Discard</text>
<line x1='220.0' y1='108.0' x2='220.0' y2='312.0' stroke='#e4e3df' stroke-width='1'/>
<text x='220.0' y='328.0' font-size='12' fill='#52514e' text-anchor='middle'>0%</text>
<line x1='345.0' y1='108.0' x2='345.0' y2='312.0' stroke='#e4e3df' stroke-width='1'/>
<text x='345.0' y='328.0' font-size='12' fill='#52514e' text-anchor='middle'>25%</text>
<line x1='470.0' y1='108.0' x2='470.0' y2='312.0' stroke='#e4e3df' stroke-width='1'/>
<text x='470.0' y='328.0' font-size='12' fill='#52514e' text-anchor='middle'>50%</text>
<line x1='595.0' y1='108.0' x2='595.0' y2='312.0' stroke='#e4e3df' stroke-width='1'/>
<text x='595.0' y='328.0' font-size='12' fill='#52514e' text-anchor='middle'>75%</text>
<line x1='720.0' y1='108.0' x2='720.0' y2='312.0' stroke='#e4e3df' stroke-width='1'/>
<text x='720.0' y='328.0' font-size='12' fill='#52514e' text-anchor='middle'>100%</text>
<text x='208.0' y='145.0' font-size='14' fill='#0b0b0b' text-anchor='end'>5,788 tool lessons</text>
<rect x='220.0' y='120' width='16.3' height='40' fill='#2a78d6'/>
<rect x='236.3' y='120' width='119.3' height='40' fill='#94bdec'/>
<rect x='355.6' y='120' width='363.5' height='40' fill='#eb6834'/>
<rect x='719.1' y='120' width='0.9' height='40' fill='#a9a7a1'/>
<text x='208.0' y='245.0' font-size='14' fill='#0b0b0b' text-anchor='end'>534 held-out test items</text>
<rect x='220.0' y='220' width='138.6' height='40' fill='#2a78d6'/>
<rect x='358.6' y='220' width='356.7' height='40' fill='#94bdec'/>
<rect x='715.3' y='220' width='4.7' height='40' fill='#a9a7a1'/>
<text x='220.0' y='112.0' font-size='12' fill='#0b0b0b' text-anchor='start'>189 kept (3%)</text>
<text x='296.0' y='178.0' font-size='12' fill='#0b0b0b' text-anchor='middle'>1,381 fix (24%)</text>
<text x='537.4' y='178.0' font-size='12' fill='#0b0b0b' text-anchor='middle'>4,208 repair (73%)</text>
<text x='289.3' y='278.0' font-size='12' fill='#0b0b0b' text-anchor='middle'>148 keep (28%)</text>
<text x='536.9' y='278.0' font-size='12' fill='#0b0b0b' text-anchor='middle'>381 fix (71%)</text>
<text x='24.0' y='370.0' font-size='12' fill='#52514e' text-anchor='start'>10 lessons and 5 test items were discarded (too thin to show). The sort of the held-out items had no "repair" verdict.</text>
<text x='24.0' y='388.0' font-size='12' fill='#52514e' text-anchor='start'>Separately, 519 of the 534 held-out items appear word for word in training-side files (Chapter 7).</text>
