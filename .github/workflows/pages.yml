# The setup picker (app/docs/install/picker.html) on GitHub Pages, at https://mousewurx.github.io/Bob/.
# Off until the owner turns it on: Settings, Pages, Source "GitHub Actions", then Settings, Secrets and variables,
# Actions, Variables, PAGES_ON = true. Until then the job is skipped, so it never fails or sends e-mail.
name: Setup picker page
on:
  push:
    branches: [main]
    paths: ['app/docs/install/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.PAGES_ON == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make the site (the picker is the front page)
        run: |
          mkdir -p _site
          cp app/docs/install/picker.html _site/index.html
          cp app/docs/install/devices.json _site/devices.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
