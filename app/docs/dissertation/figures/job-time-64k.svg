<svg xmlns='http://www.w3.org/2000/svg' width='760' height='410' viewBox='0 0 760 410' font-family='Helvetica, Arial, sans-serif'>
<rect width='760' height='410' fill='#fcfcfb'/>
<text x='24' y='36' font-size='19' font-weight='600' fill='#0b0b0b'>A 64K job with Bob's settings and with stock llama.cpp defaults</text>
<text x='24' y='60' font-size='14' fill='#52514e'>Seconds for the whole job: a 24K file read, then 5 follow-ups of 300 words. 5 rounds, cooled.</text>
<line x1='250.0' y1='92.0' x2='250.0' y2='310.0' stroke='#e4e3df' stroke-width='1'/>
<text x='250.0' y='336.0' font-size='12' fill='#52514e' text-anchor='middle'>0 s</text>
<line x1='337.5' y1='92.0' x2='337.5' y2='310.0' stroke='#e4e3df' stroke-width='1'/>
<text x='337.5' y='336.0' font-size='12' fill='#52514e' text-anchor='middle'>20 s</text>
<line x1='425.0' y1='92.0' x2='425.0' y2='310.0' stroke='#e4e3df' stroke-width='1'/>
<text x='425.0' y='336.0' font-size='12' fill='#52514e' text-anchor='middle'>40 s</text>
<line x1='512.5' y1='92.0' x2='512.5' y2='310.0' stroke='#e4e3df' stroke-width='1'/>
<text x='512.5' y='336.0' font-size='12' fill='#52514e' text-anchor='middle'>60 s</text>
<line x1='600.0' y1='92.0' x2='600.0' y2='310.0' stroke='#e4e3df' stroke-width='1'/>
<text x='600.0' y='336.0' font-size='12' fill='#52514e' text-anchor='middle'>80 s</text>
<text x='238.0' y='122.0' font-size='14' fill='#0b0b0b' text-anchor='end'>Step 4096 throughout</text>
<rect x='250.0' y='100.0' width='163.6' height='34.0' rx='3' fill='#2a78d6'/>
<text x='421.6' y='122.0' font-size='13' fill='#52514e' text-anchor='start'>37.4 s  (first word 10.1 s)</text>
<text x='238.0' y='178.0' font-size='14' fill='#0b0b0b' text-anchor='end'>Conductor: read 6144, chat 2048</text>
<rect x='250.0' y='156.0' width='169.3' height='34.0' rx='3' fill='#94bdec'/>
<text x='427.3' y='178.0' font-size='13' fill='#52514e' text-anchor='start'>38.7 s  (first word 8.8 s)</text>
<text x='238.0' y='234.0' font-size='14' fill='#0b0b0b' text-anchor='end'>Step 2048 throughout</text>
<rect x='250.0' y='212.0' width='193.8' height='34.0' rx='3' fill='#94bdec'/>
<text x='451.8' y='234.0' font-size='13' fill='#52514e' text-anchor='start'>44.3 s  (first word 14.0 s)</text>
<text x='238.0' y='290.0' font-size='14' fill='#0b0b0b' text-anchor='end'>Stock b12359, its own defaults</text>
<rect x='250.0' y='268.0' width='307.1' height='34.0' rx='3' fill='#eb6834'/>
<text x='565.1' y='290.0' font-size='13' fill='#52514e' text-anchor='start'>70.2 s  (first word 36.8 s)</text>
<text x='425.0' y='352.0' font-size='13' fill='#52514e' text-anchor='middle'>Seconds (shorter is better)</text>
<text x='24.0' y='380.0' font-size='12' fill='#52514e' text-anchor='start'>Most of the gap comes from settings stock llama.cpp also accepts (the step, flash attention, the context cache),</text>
<text x='24.0' y='398.0' font-size='12' fill='#52514e' text-anchor='start'>so this compares settings, not engines. Lamplight 26, stock Qwen3.6 35B at Q4, 16 GB card.</text>
</svg>
