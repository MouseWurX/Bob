<text x='24' y='450' font-size='12' fill='#52514e'>q4_0 drifts 2.8x as much as q8_0 by this measure, yet its perplexity is only 0.3% worse,</text>
<text x='24' y='466' font-size='12' fill='#52514e'>and it frees about 0.7 GB of the card at 128K and 1.3 GB at 256K.</text>
<text x='24' y='482' font-size='12' fill='#52514e'>* iq4_nl timed out in every long-prompt speed run, so it is not usable despite its score. One perplexity run per type.</text>
