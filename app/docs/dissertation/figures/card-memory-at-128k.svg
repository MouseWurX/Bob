<svg xmlns='http://www.w3.org/2000/svg' width='760' height='470' viewBox='0 0 760 470' font-family='Helvetica, Arial, sans-serif'>
<rect width='760' height='470' fill='#fcfcfb'/>
<text x='24' y='36' font-size='19' font-weight='600' fill='#0b0b0b'>Where the 16 GB card goes with Bob's settings at 128K</text>
<text x='24' y='60' font-size='14' fill='#52514e'>MiB of card memory. Step 4096, 4 GB copy cache, q4_0 chat memory, 512 MB fit margin.</text>
<path d='M 200.00 115.00 A 140 140 0 0 1 340.00 255.00 L 278.00 255.00 A 78 78 0 0 0 200.00 177.00 Z' fill='#2a78d6' stroke='#fcfcfb' stroke-width='2'/>
