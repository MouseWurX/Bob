# A one-off test build (Nov 20, the owner's pick on the decision card): plain Avalon (github freriadoc/Avalon, MIT, a
# llama.cpp fork by Frederic Belval) at a pinned commit, for Windows x64 and NVIDIA cards (sm_120, the 50 series), so
# it can be measured once on the test PC against Lamplight 28's best settings. Built here, never on the test PC.
# Nothing of Bob's is applied. Avalon is written for GCC/Clang on Linux, and nvcc on Windows must use MSVC, which
# rejects a few GCC-only spellings: .github/avalon-win/fix-windows-build.py makes build-only fixes (listed in its log and
# in the zip's README), no engine changes. Runs when this file or the fixes change on a claude/ work branch, and by hand.
name: Avalon test build

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/avalon-test.yml', '.github/avalon-win/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALON_SHA: 0019bc940a4abe07519974aff0ef7ae29f41f76b
  CUDAVER: '12.9'

jobs:
  windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - name: Fetch Avalon at the pinned commit
        shell: bash
        run: |
          git init avalon && cd avalon
          git remote add origin https://github.com/freriadoc/Avalon.git
          git fetch --depth 1 origin "$AVALON_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='%H %ci %s'
      - name: Windows build fixes (spelling only, listed)
        shell: bash
        run: |
          python .github/avalon-win/fix-windows-build.py avalon
          cd avalon && git add -A && git diff --cached --stat && git diff --cached > ../out-windows-build-fixes.diff
      - name: Install CUDA ${{ env.CUDAVER }} (NVIDIA's redistributable parts, compiler and headers only)
        shell: pwsh
        run: |
          $want = '${{ env.CUDAVER }}'
          if (-not $want) { throw 'No official CUDA zip found for this tag' }
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist/'
          $list = (Invoke-WebRequest $base -UseBasicParsing).Content
          $ver = [regex]::Matches($list, "redistrib_($([regex]::Escape($want))(\.\d+)*)\.json") | ForEach-Object { $_.Groups[1].Value } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $ver) { throw "No NVIDIA redistributable list for CUDA $want" }
          "CUDA $want -> $ver"
          $json = Invoke-RestMethod "$base/redistrib_$ver.json"
          $cuda = "$env:RUNNER_TEMP\cuda"
          New-Item -ItemType Directory -Force $cuda | Out-Null
          $names = @($json.PSObject.Properties | Where-Object { $_.Value -is [psobject] } | ForEach-Object { $_.Name })
          "parts in ${ver}: $($names -join ', ')"
          # CCCL (CUB, Thrust) moved name over CUDA versions (cuda_cccl, then others): take whatever part carries it.
          $want = @('cuda_nvcc','cuda_crt','libnvvm','cuda_cudart','cuda_nvrtc','cuda_nvtx','cuda_profiler_api','libcublas') + @($names | Where-Object { $_ -match 'cccl' })
          foreach ($n in $want) {
            $part = $json.$n
            if (-not $part) { "skip $n (not in $ver)"; continue }
            $rel = $part.'windows-x86_64'.relative_path
            if (-not $rel) { "skip $n (no Windows part)"; continue }
            "get $n $($part.version)"
            Invoke-WebRequest "$base/$rel" -OutFile part.zip
            Expand-Archive part.zip -DestinationPath parts -Force
            Remove-Item part.zip
          }
          Get-ChildItem parts -Directory | ForEach-Object { Copy-Item "$($_.FullName)\*" $cuda -Recurse -Force }
          if (-not (Test-Path "$cuda\bin\nvcc.exe")) { throw 'nvcc did not install' }
          # CMake's CUDA::cudart lists include\cccl from CUDA 13 on; without a CCCL part the folder must still be there,
          # and the headers then come from NVIDIA's CCCL on GitHub at the tag that matches.
          if (-not (Test-Path "$cuda\include\cccl\cub")) {
            "No CCCL part in the list: getting it from github.com/NVIDIA/cccl"
            $cv = Select-String -Path "$cuda\include\cuda\std\__cccl\version.h" -Pattern 'define CCCL_(MAJOR|MINOR|PATCH)_VERSION\s+(\d+)' -ErrorAction SilentlyContinue | ForEach-Object { $_.Matches[0].Groups[2].Value }
            $ctag = if ($cv.Count -eq 3) { "v$($cv -join '.')" } else { 'main' }
            "CCCL tag: $ctag"
            git clone --depth 1 --branch $ctag https://github.com/NVIDIA/cccl.git "$env:RUNNER_TEMP\cccl"
            New-Item -ItemType Directory -Force "$cuda\include\cccl" | Out-Null
            foreach ($d in 'cub\cub','thrust\thrust','libcudacxx\include\cuda','libcudacxx\include\nv') { Copy-Item "$env:RUNNER_TEMP\cccl\$d" "$cuda\include\cccl\" -Recurse -Force }
          }
          Get-ChildItem "$cuda\include\cccl" -ErrorAction SilentlyContinue | Select-Object -First 10 Name
          "CUDA_PATH=$cuda" | Out-File -Append $env:GITHUB_ENV
          "CUDAToolkit_ROOT=$cuda" | Out-File -Append $env:GITHUB_ENV
          "$cuda\bin" | Out-File -Append $env:GITHUB_PATH
      - name: Install Ninja
        run: choco install ninja
      - name: Build llama-server (CUDA in, one set of files)
        shell: cmd
        working-directory: avalon
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          nvcc --version
          rem Avalon's processor code uses GCC atomics and OpenMP loop forms MSVC rejects: C and C++ go through clang-cl (VS ships it), CUDA through nvcc with MSVC as its host.
          set "PATH=%VCINSTALLDIR%Tools\Llvm\x64\bin;%PATH%"
          cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BACKEND_DL=OFF -DGGML_CUDA=ON -DGGML_CUDA_NCCL=OFF -DCMAKE_CUDA_ARCHITECTURES=120a-real -DLLAMA_OPENSSL=OFF -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DCMAKE_CUDA_COMPILER="%CUDA_PATH%\bin\nvcc.exe"
          rem No web page: Bob talks to the server API only, and the prebuilt page download from HF failed its file check.
          rem -k 0: keep going after a failed file, so one run lists every file Windows still rejects.
          rem The full log goes to a file (the job log view keeps only its end); on a failure, every failed file and error line is printed.
          cmake --build build --config Release -j 4 --target llama-server llama-bench -- -k 0 > ..\build-log.txt 2>&1 || (echo BUILD FAILED & exit /b 1)
      - name: Show each build error once, with its source lines
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build-log.txt)) { 'no build log'; exit 0 }
          $l = Get-Content build-log.txt; $seen = @{}
          for ($i = 0; $i -lt $l.Count; $i++) {
            if ($l[$i] -match 'FAILED:|: error|error C\d|error LNK|fatal error') {
              $k = $l[$i] -replace '^\s+', ''
              if (-not $seen.ContainsKey($k)) { $seen[$k] = 1; '-----'; $l[[Math]::Max(0, $i - 3)..[Math]::Min($l.Count - 1, $i + 6)] }
            }
          }
          "$($seen.Count) different error lines"
      - name: Keep the full build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avalon-build-log
          path: build-log.txt
          if-no-files-found: ignore
      - name: Pack it with the CUDA runtime it needs
        shell: bash
        run: |
          mkdir -p out
          cp avalon/build/bin/Release/*.exe avalon/build/bin/Release/*.dll out/ 2>/dev/null || true
          cp "$CUDA_PATH"/bin/cudart64_*.dll "$CUDA_PATH"/bin/cublas64_*.dll "$CUDA_PATH"/bin/cublasLt64_*.dll out/
          cp avalon/LICENSE out/AVALON-LICENSE.txt
          cp out-windows-build-fixes.diff out/WINDOWS-BUILD-FIXES.diff
          echo "Avalon $AVALON_SHA (github freriadoc/Avalon, MIT), CUDA $CUDAVER, sm_120a. A test build for one measurement. Windows build-only fixes: WINDOWS-BUILD-FIXES.diff. On Linux NVIDIA, Avalon sets CUDA_MODULE_LOADING=EAGER and GGML_CUDA_MOE_RING_PREFILL=900 by itself at start; its Windows build does not, so set both for a like-for-like run." > out/README.txt
          ls -la out
          test -f out/llama-server.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: avalon-0019bc9-win-cuda-sm120
          path: out/
