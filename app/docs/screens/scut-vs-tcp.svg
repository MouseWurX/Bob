<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1012" width="1280" height="1012" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>SCUT and TCP side by side</title>
  <desc>How a lent graphics card's messages travel between two Bobs. Plain TCP sends one ordered byte stream and waits about 200 to 300 milliseconds for its timeout when the last packet of a message is lost. SCUT, Bob's own experimental link, carries the same engine messages as numbered UDP packets with a 20-byte header, selective acks, resends after a few milliseconds, one repair packet per burst, its own pacing under a speed cap, a keep-awake ping, and a seal on every packet. The TCP connection stays open beside it, and Bob falls back to TCP whenever SCUT can't be used.</desc>
  <style>
    .bg{fill:#0c0f12}.panel{fill:#12171b;stroke:#2a3339}.box{fill:#182026;stroke:#2f3a41}.same{fill:#1b1f1a;stroke:#4a4232}
    .h{fill:#f3ead8}.t{fill:#d9cfbb}.m{fill:#8f9aa3}.amber{fill:#f2b25c}.teal{fill:#5fd4c8}.grey{fill:#8f9aa3}
    .tcpS{stroke:#8f9aa3}.scutS{stroke:#5fd4c8}.ampS{stroke:#f2b25c}
    .pkt{fill:#1f2a30;stroke:#5fd4c8}.pktT{fill:#22272b;stroke:#8f9aa3}.lost{fill:none;stroke:#e46b5a;stroke-dasharray:4 3}
    .tag{fill:#3a2a12;stroke:#f2b25c}.mono{font-family:Consolas, Menlo, monospace}
    @media (prefers-color-scheme: light){
      .bg{fill:#f7f3ea}.panel{fill:#fffdf8;stroke:#d8cfbd}.box{fill:#f3efe6;stroke:#d0c6b3}.same{fill:#f6efdf;stroke:#c9b48a}
      .h{fill:#2a2418}.t{fill:#3d3628}.m{fill:#6b675e}.amber{fill:#a8650f}.teal{fill:#11807a}.grey{fill:#6b675e}
      .tcpS{stroke:#6b675e}.scutS{stroke:#11807a}.ampS{stroke:#a8650f}
      .pkt{fill:#e6f4f2;stroke:#11807a}.pktT{fill:#ece8df;stroke:#6b675e}.lost{stroke:#c0392b}.tag{fill:#f6e6c8;stroke:#a8650f}
    }
  </style>
  <defs>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="teal"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="grey"/></marker>
  </defs>

  <rect width="1280" height="1012" class="bg"/>

  <!-- title -->
  <text x="40" y="56" font-size="30" font-weight="700" class="h">SCUT and TCP</text>
  <rect x="270" y="32" width="112" height="30" rx="15" class="tag" stroke-width="1.5"/>
  <text x="326" y="53" font-size="14" font-weight="600" text-anchor="middle" class="amber">experimental</text>
  <text x="40" y="86" font-size="15" class="m">How a lent graphics card's messages travel between two Bobs sharing one brain. SCUT is off unless you turn it on, on both Bobs.</text>

  <!-- shared top: the engine's messages -->
  <rect x="40" y="108" width="1200" height="64" rx="14" class="same" stroke-width="1.5"/>
  <text x="640" y="136" font-size="16" font-weight="600" text-anchor="middle" class="t">Lamplight on each Bob: the same card-sharing messages either way</text>
  <text x="640" y="158" font-size="13" text-anchor="middle" class="m">Send a piece of the brain, run this graph, read this result. Only how the bytes travel changes; the answer is the same word for word.</text>
  <line x1="340" y1="172" x2="340" y2="204" class="tcpS" stroke-width="2" marker-end="url(#aG)"/>
  <line x1="940" y1="172" x2="940" y2="204" class="scutS" stroke-width="2" marker-end="url(#aT)"/>

  <!-- ========== TCP column ========== -->
  <rect x="40" y="208" width="590" height="572" rx="18" class="panel" stroke-width="1.5"/>
  <text x="64" y="242" font-size="20" font-weight="700" class="t">Plain TCP</text>
  <text x="64" y="264" font-size="13" class="m">What llama.cpp uses on its own. Bob's usual link.</text>

  <rect x="64" y="282" width="542" height="58" rx="10" class="box" stroke-width="1.2"/>
  <text x="80" y="306" font-size="14" font-weight="600" class="t">One ordered stream of bytes</text>
  <text x="80" y="326" font-size="13" class="m">No messages or packet numbers the engine can see.</text>

  <rect x="64" y="350" width="542" height="58" rx="10" class="box" stroke-width="1.2"/>
  <text x="80" y="374" font-size="14" font-weight="600" class="t">The computer's own TCP does the rest</text>
  <text x="80" y="394" font-size="13" class="m">Acks, resends and speed are the operating system's, tuned for the internet.</text>

  <rect x="64" y="418" width="542" height="58" rx="10" class="box" stroke-width="1.2"/>
  <text x="80" y="442" font-size="14" font-weight="600" class="t">Wi-Fi or cable, card port 50052</text>
  <text x="80" y="462" font-size="13" class="m">Over Tailscale, Tailscale scrambles it.</text>

  <!-- TCP packet -->
  <text x="64" y="508" font-size="14" font-weight="600" class="t">On the air</text>
  <rect x="64" y="520" width="140" height="40" rx="6" class="pktT" stroke-width="1.2"/>
  <text x="134" y="545" font-size="13" text-anchor="middle" class="t">IP + TCP header</text>
  <rect x="204" y="520" width="402" height="40" rx="6" class="pktT" stroke-width="1.2"/>
  <text x="405" y="545" font-size="13" text-anchor="middle" class="m">the next bytes of the stream</text>

  <!-- TCP loss -->
  <text x="64" y="596" font-size="14" font-weight="600" class="t">When the last packet of a message is lost</text>
  <rect x="64" y="610" width="40" height="26" rx="4" class="pktT" stroke-width="1.2"/>
  <rect x="110" y="610" width="40" height="26" rx="4" class="pktT" stroke-width="1.2"/>
  <rect x="156" y="610" width="40" height="26" rx="4" class="lost" stroke-width="1.5"/>
  <text x="176" y="628" font-size="14" text-anchor="middle" fill="#e46b5a">×</text>
  <line x1="204" y1="623" x2="530" y2="623" class="tcpS" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="540" y="610" width="40" height="26" rx="4" class="pktT" stroke-width="1.2"/>
  <text x="367" y="656" font-size="13" text-anchor="middle" class="m">nothing comes after it to show it's missing, so TCP waits</text>
  <text x="367" y="676" font-size="13" text-anchor="middle" class="m">for its timeout (about 200 to 300 ms), then sends it again</text>

  <text x="64" y="718" font-size="13" class="m">Every word waits on the slowest packet. On weak Wi-Fi,</text>
  <text x="64" y="738" font-size="13" class="m">small packets took 3 to 194 ms there and back.</text>

  <!-- ========== SCUT column ========== -->
  <rect x="650" y="208" width="590" height="572" rx="18" class="panel" stroke-width="1.5"/>
  <text x="674" y="242" font-size="20" font-weight="700" class="teal">SCUT</text>
  <text x="736" y="242" font-size="13" class="m">Signals and Communications - Universal Transceiver</text>
  <text x="674" y="264" font-size="13" class="m">Bob's own link (Lamplight patches 0005, 0006 and 0008).</text>

  <rect x="674" y="282" width="542" height="76" rx="10" class="box" stroke-width="1.2"/>
  <text x="690" y="306" font-size="14" font-weight="600" class="t">Numbered packets, acked and resent by Bob</text>
  <text x="690" y="326" font-size="13" class="m">Selective acks (up to 64 ranges). A lost packet is sent again after a</text>
  <text x="690" y="344" font-size="13" class="m">few ms, timed from the measured round trip.</text>

  <rect x="674" y="368" width="542" height="58" rx="10" class="box" stroke-width="1.2"/>
  <text x="690" y="392" font-size="14" font-weight="600" class="t">Its own pace, under your speed cap</text>
  <text x="690" y="412" font-size="13" class="m">Backs off when packets are lost or the line queues; retunes itself.</text>

  <rect x="674" y="436" width="542" height="58" rx="10" class="box" stroke-width="1.2"/>
  <text x="690" y="460" font-size="14" font-weight="600" class="t">UDP on the card port; the TCP line stays open</text>
  <text x="690" y="480" font-size="13" class="m">TCP only shows both Bobs are still there. No SCUT, no problem: TCP.</text>

  <!-- SCUT packet -->
  <text x="674" y="526" font-size="14" font-weight="600" class="t">On the air (sealed, the default)</text>
  <rect x="674" y="538" width="96" height="40" rx="6" class="pktT" stroke-width="1.2"/>
  <text x="722" y="563" font-size="12" text-anchor="middle" class="m">IP + UDP</text>
  <rect x="770" y="538" width="150" height="40" rx="6" class="pkt" stroke-width="1.2"/>
  <text x="845" y="556" font-size="12" text-anchor="middle" class="teal">SCUT header, 20 B</text>
  <text x="845" y="571" font-size="11" text-anchor="middle" class="m">kind, number, time</text>
  <rect x="920" y="538" width="80" height="40" rx="6" class="pkt" stroke-width="1.2"/>
  <text x="960" y="556" font-size="12" text-anchor="middle" class="teal">counter</text>
  <text x="960" y="571" font-size="11" text-anchor="middle" class="m">8 B</text>
  <rect x="1000" y="538" width="136" height="40" rx="6" class="pkt" stroke-width="1.2"/>
  <text x="1068" y="556" font-size="12" text-anchor="middle" class="t">data, scrambled</text>
  <text x="1068" y="571" font-size="11" text-anchor="middle" class="m">ChaCha20</text>
  <rect x="1136" y="538" width="80" height="40" rx="6" class="pkt" stroke-width="1.2"/>
  <text x="1176" y="556" font-size="12" text-anchor="middle" class="teal">seal</text>
  <text x="1176" y="571" font-size="11" text-anchor="middle" class="m">16 B</text>
  <text x="674" y="598" font-size="12" class="m">A packet that fails the seal check (changed, made up, replayed) is dropped unread.</text>

  <!-- SCUT loss -->
  <text x="674" y="630" font-size="14" font-weight="600" class="t">When the last packet of a message is lost</text>
  <rect x="674" y="644" width="40" height="26" rx="4" class="pkt" stroke-width="1.2"/>
  <rect x="720" y="644" width="40" height="26" rx="4" class="pkt" stroke-width="1.2"/>
  <rect x="766" y="644" width="40" height="26" rx="4" class="lost" stroke-width="1.5"/>
  <text x="786" y="662" font-size="14" text-anchor="middle" fill="#e46b5a">×</text>
  <rect x="812" y="644" width="56" height="26" rx="4" class="tag" stroke-width="1.2"/>
  <text x="840" y="662" font-size="12" text-anchor="middle" class="amber">repair</text>
  <line x1="874" y1="657" x2="928" y2="657" class="scutS" stroke-width="2" marker-end="url(#aT)"/>
  <rect x="934" y="644" width="40" height="26" rx="4" class="pkt" stroke-width="1.2"/>
  <text x="986" y="662" font-size="13" class="teal">rebuilt at once</text>
  <text x="674" y="696" font-size="13" class="m">Each burst carries a repair packet (the XOR of its packets),</text>
  <text x="674" y="716" font-size="13" class="m">so one lost packet is rebuilt without asking again.</text>
  <text x="674" y="744" font-size="13" class="m">Before switching, SUDDAR times up to 10 pings. While words flow, a</text>
  <text x="674" y="762" font-size="13" class="m">tiny ping every 25 ms of quiet keeps a handheld's Wi-Fi awake.</text>

  <!-- ========== measured ========== -->
  <rect x="40" y="800" width="1200" height="180" rx="18" class="panel" stroke-width="1.5"/>
  <text x="64" y="834" font-size="17" font-weight="700" class="t">Measured once, on weak home Wi-Fi</text>
  <text x="64" y="856" font-size="13" class="m">One brain (Riker) spread over a PC and a handheld, same split, same prompts, minutes apart. Words a second while answering:</text>

  <text x="64" y="896" font-size="14" font-weight="600" class="t">TCP</text>
  <rect x="140" y="880" width="129" height="22" rx="4" fill="#8f9aa3" class="grey"/>
  <text x="280" y="896" font-size="14" class="t">3.5 to 4.8</text>
  <text x="64" y="932" font-size="14" font-weight="600" class="teal">SCUT</text>
  <rect x="140" y="916" width="476" height="22" rx="4" fill="#5fd4c8" class="teal"/>
  <text x="628" y="932" font-size="14" font-weight="600" class="teal">17.0 to 17.7</text>

  <text x="760" y="896" font-size="13" class="m">Wait for each answer, average:</text>
  <text x="760" y="916" font-size="13" class="t">TCP 106.5 ms · SCUT 57.6 ms</text>
  <text x="760" y="948" font-size="13" class="m">One run on one Wi-Fi; over a cable it isn't measured yet.</text>
  <text x="64" y="966" font-size="12" class="m">Source: app/docs/test-results/2026-11-12-scut-vs-tcp-over-wifi.md</text>
</svg>
