<svg xmlns='http://www.w3.org/2000/svg' width='760' height='400' viewBox='0 0 760 400' font-family='Helvetica, Arial, sans-serif'>
<rect width='760' height='400' fill='#fcfcfb'/>
<text x='24' y='36' font-size='19' font-weight='600' fill='#0b0b0b'>How many steps a job takes, against the old step caps</text>
<text x='24' y='60' font-size='14' fill='#52514e'>Steps per job in 518 stock-Qwen runs. Bars: typical (median) and 9 in 10 jobs. Dot: the longest seen.</text>
<rect x='24.0' y='75.0' width='12.0' height='12.0' rx='2' fill='#2a78d6'/>
<text x='42.0' y='85.0' font-size='12' fill='#52514e' text-anchor='start'>Median</text>
<rect x='97.2' y='75.0' width='12.0' height='12.0' rx='2' fill='#94bdec'/>
<text x='115.2' y='85.0' font-size='12' fill='#52514e' text-anchor='start'>9 in 10 finish within</text>
<rect x='278.4' y='75.0' width='12.0' height='12.0' rx='2' fill='#eb6834'/>
<text x='296.4' y='85.0' font-size='12' fill='#52514e' text-anchor='start'>Longest</text>
<line x1='160.0' y1='100.0' x2='160.0' y2='300.0' stroke='#e4e3df' stroke-width='1'/>
<text x='160.0' y='318.0' font-size='12' fill='#52514e' text-anchor='middle'>0</text>
<line x1='295.0' y1='100.0' x2='295.0' y2='300.0' stroke='#e4e3df' stroke-width='1'/>
<text x='295.0' y='318.0' font-size='12' fill='#52514e' text-anchor='middle'>8</text>
<line x1='430.0' y1='100.0' x2='430.0' y2='300.0' stroke='#e4e3df' stroke-width='1'/>
<text x='430.0' y='318.0' font-size='12' fill='#52514e' text-anchor='middle'>16</text>
<line x1='565.0' y1='100.0' x2='565.0' y2='300.0' stroke='#e4e3df' stroke-width='1'/>
<text x='565.0' y='318.0' font-size='12' fill='#52514e' text-anchor='middle'>24</text>
<line x1='700.0' y1='100.0' x2='700.0' y2='300.0' stroke='#e4e3df' stroke-width='1'/>
<text x='700.0' y='318.0' font-size='12' fill='#52514e' text-anchor='middle'>32</text>
<text x='148.0' y='142.0' font-size='14' fill='#0b0b0b' text-anchor='end'>Everyday</text>
<rect x='160.0' y='120.0' width='101.2' height='18.0' rx='3' fill='#94bdec'/>
<rect x='160.0' y='142.0' width='33.8' height='18.0' rx='3' fill='#2a78d6'/>
<text x='267.2' y='134.0' font-size='12' fill='#52514e' text-anchor='start'>6</text>
<text x='199.8' y='156.0' font-size='12' fill='#52514e' text-anchor='start'>2</text>
<text x='148.0' y='204.0' font-size='14' fill='#0b0b0b' text-anchor='end'>Office</text>
<rect x='160.0' y='182.0' width='118.1' height='18.0' rx='3' fill='#94bdec'/>
<rect x='160.0' y='204.0' width='67.5' height='18.0' rx='3' fill='#2a78d6'/>
<text x='284.1' y='196.0' font-size='12' fill='#52514e' text-anchor='start'>7</text>
<text x='233.5' y='218.0' font-size='12' fill='#52514e' text-anchor='start'>4</text>
<text x='148.0' y='266.0' font-size='14' fill='#0b0b0b' text-anchor='end'>Repo (coding)</text>
<rect x='160.0' y='244.0' width='286.9' height='18.0' rx='3' fill='#94bdec'/>
<rect x='160.0' y='266.0' width='151.9' height='18.0' rx='3' fill='#2a78d6'/>
<text x='452.9' y='258.0' font-size='12' fill='#52514e' text-anchor='start'>17</text>
<text x='317.9' y='280.0' font-size='12' fill='#52514e' text-anchor='start'>9</text>
<circle cx='649.4' cy='264.0' r='6' fill='#eb6834' stroke='#fcfcfb' stroke-width='2'/>
<text x='649.4' y='244.0' font-size='12' fill='#0b0b0b' text-anchor='middle'>29</text>
<line x1='295.0' y1='100.0' x2='295.0' y2='300.0' stroke='#eb6834' stroke-width='1.5' stroke-dasharray='5 4'/>
<text x='299.0' y='300.0' font-size='11' fill='#eb6834' text-anchor='start'>old cap, Minimus</text>
<line x1='565.0' y1='100.0' x2='565.0' y2='300.0' stroke='#eb6834' stroke-width='1.5' stroke-dasharray='5 4'/>
<text x='569.0' y='110.0' font-size='11' fill='#eb6834' text-anchor='start'>old cap, Maximus</text>
<text x='430.0' y='338.0' font-size='13' fill='#52514e' text-anchor='middle'>Steps</text>
<text x='24.0' y='370.0' font-size='12' fill='#52514e' text-anchor='start'>The old caps were 8, 12, 16 and 24 steps by level. They cost 5 of 96 after2 runs, and the cap of 8 at Minimus would</text>
<text x='24.0' y='388.0' font-size='12' fill='#52514e' text-anchor='start'>have cut off over half the coding jobs. The caps were removed on 21 November; only being stuck now ends a job.</text>
</svg>
