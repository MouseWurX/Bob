# Builds Brain Engine (app/engine/README.md): llama.cpp at bundledLlamaTag with app/engine/patches/ applied.
# Runs when app/engine/ or this file changes on main or in a pull request that is ready for review, and by hand.
# Pushes to work branches and draft pull requests run nothing, like build.yml, so a work-in-progress patch never
# sends a failed-build e-mail: a thread checks its engine patch with its own build first (app/engine/README.md).
# Windows x64: the llama.dll / llama-server.exe set, to put over a COPY of the official CUDA or Vulkan zip for the same tag (the card backends are separate DLLs and are not changed).
# Linux x64: the same set for checking. Every action is pinned to a full commit SHA, like build.yml.
name: Brain Engine

on:
  push:
    branches: [main]
    paths: ['app/engine/**', '.github/workflows/brain-engine.yml']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['app/engine/**', '.github/workflows/brain-engine.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also put the two files on a test pre-release (brain-engine-<tag>), for Get models, Engines'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    # draft pull requests run nothing
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-2025-vs2026
    permissions:
      contents: write # only used by the publish step, which runs only when asked for by hand
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch llama.cpp at the tested tag and apply the patches
        shell: bash
        run: |
          tag=$(node -p "require('./app/package.json').bob.bundledLlamaTag")
          echo "TAG=$tag" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$tag" https://github.com/ggml-org/llama.cpp.git llama.cpp
          # A one-commit clone counts "build 1"; say the tag's number instead, so --version reads like llama.cpp's own builds.
          sed -i "s/set(BUILD_NUMBER \${COUNT})/set(BUILD_NUMBER ${tag#b})/" llama.cpp/cmake/build-info.cmake
          for p in app/engine/patches/*.patch; do git -C llama.cpp apply --verbose "../$p"; done
      - name: Install Ninja
        run: choco install ninja
      - name: Build (the official windows-cpu settings)
        shell: cmd
        working-directory: llama.cpp
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake -DLLAMA_BUILD_BORINGSSL=ON -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_OPENMP=ON -DGGML_OPENMP_FETCH=ON -DGGML_RPC=ON -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build build --config Release --target llama-server llama-bench llama-gguf-split ggml-rpc-server llama-diffusion-cli
      - name: Build llama-cvector-generator and llama-export-lora on their own (CPU, static; upstream skips it when the backends load at run time)
        shell: cmd
        working-directory: llama.cpp
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build-cv -G Ninja -D CMAKE_BUILD_TYPE=Release -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BACKEND_DL=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build-cv --target llama-cvector-generator llama-export-lora
      - name: Pack (llama and server files, and the card-sharing backend; never the card backends)
        shell: bash
        run: |
          out=brain-engine-$TAG-win-x64
          mkdir "$out"
          cd llama.cpp/build/bin/Release
          cp llama-server.exe $(ls *.dll | grep -v '^ggml') "../../../../$out/"
          # the four tools Bob uses beside the server: speed test, split/join, brain sharing over Tailscale, diffusion brains.
          # ggml-rpc-server and the card-sharing backend (patch 0004) are copied by name (the ggml filter above is for the card backends, which stay the official ones).
          cp llama-bench.exe llama-gguf-split.exe ggml-rpc-server.exe ggml-rpc.dll llama-diffusion-cli.exe "../../../../$out/"
          cd ../../../..
          cp llama.cpp/build-cv/bin/llama-cvector-generator.exe llama.cpp/build-cv/bin/llama-export-lora.exe "$out/"
          cp llama.cpp/LICENSE "$out/LICENSE-llama.cpp"
          cp app/engine/README.md "$out/README-Brain-Engine.md"
          ls -la "$out"
      # Smart App Control (app/docs/SIGNING.md): off until the owner's Microsoft Artifact Signing account is set up.
      # Then: variable ARTIFACT_SIGNING_ENABLED = true, ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT,
      # ARTIFACT_SIGNING_PROFILE, AZURE_TENANT_ID, AZURE_CLIENT_ID, and the secret AZURE_CLIENT_SECRET.
      - name: Sign every program file (Microsoft Artifact Signing)
        if: ${{ vars.ARTIFACT_SIGNING_ENABLED == 'true' }}
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\brain-engine-${{ env.TAG }}-win-x64
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: List unsigned files (Smart App Control; fails only once REQUIRE_SIGNED is "true")
        shell: bash
        run: node app/installer/check-signed.js "brain-engine-$TAG-win-x64" --summary "$GITHUB_STEP_SUMMARY" ${{ vars.REQUIRE_SIGNED == 'true' && '--require' || '' }}
      - name: Zip
        shell: bash
        run: 7z a "brain-engine-$TAG-win-x64.zip" "./brain-engine-$TAG-win-x64/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brain-engine-win-x64
          path: brain-engine-*-win-x64.zip
      - name: Publish to the test pre-release (by hand only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash app/engine/publish.sh "$TAG" brain-engine-*-win-x64.zip

  linux:
    # draft pull requests run nothing
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the publish step, which runs only when asked for by hand
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch llama.cpp at the tested tag and apply the patches
        run: |
          tag=$(node -p "require('./app/package.json').bob.bundledLlamaTag")
          echo "TAG=$tag" >> "$GITHUB_ENV"
          git clone --depth 1 --branch "$tag" https://github.com/ggml-org/llama.cpp.git llama.cpp
          # A one-commit clone counts "build 1"; say the tag's number instead, so --version reads like llama.cpp's own builds.
          sed -i "s/set(BUILD_NUMBER \${COUNT})/set(BUILD_NUMBER ${tag#b})/" llama.cpp/cmake/build-info.cmake
          for p in app/engine/patches/*.patch; do git -C llama.cpp apply --verbose "../$p"; done
      - name: Build
        working-directory: llama.cpp
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_RPC=ON -DLLAMA_BUILD_EXAMPLES=ON
          cmake --build build -j4 --target llama-server llama-bench llama-gguf-split ggml-rpc-server llama-diffusion-cli
          # upstream skips cvector-generator and export-lora when the backends load at run time, so it gets its own CPU-only, static build
          cmake -B build-cv -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BACKEND_DL=OFF -DBUILD_SHARED_LIBS=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
          cmake --build build-cv -j4 --target llama-cvector-generator llama-export-lora
      - name: Pack
        run: |
          out=brain-engine-$TAG-linux-x64
          mkdir "$out"
          cp llama.cpp/build/bin/llama-server llama.cpp/build/bin/llama-bench llama.cpp/build/bin/llama-gguf-split llama.cpp/build/bin/ggml-rpc-server llama.cpp/build/bin/llama-diffusion-cli llama.cpp/build-cv/bin/llama-cvector-generator llama.cpp/build-cv/bin/llama-export-lora $(ls llama.cpp/build/bin/*.so* | grep -v '/libggml') llama.cpp/build/bin/libggml-rpc.so* "$out/"
          cp llama.cpp/LICENSE "$out/LICENSE-llama.cpp"
          cp app/engine/README.md "$out/README-Brain-Engine.md"
          tar czf "$out.tar.gz" "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brain-engine-linux-x64
          path: brain-engine-*-linux-x64.tar.gz
      - name: Publish to the test pre-release (by hand only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash app/engine/publish.sh "$TAG" brain-engine-*-linux-x64.tar.gz
