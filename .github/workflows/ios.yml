# Builds Bob for iPhone (the ios/ folder) on GitHub's Mac: on every new version on main, on a pull request that
# changes it once it is ready for review, and on demand.
#  1. Builds the brain engine (llama.cpp at android/llama.cpp.pin, Metal) for iPhones and the simulator.
#  2. Builds the app twice: for the iPhone simulator, and for iPhones as an unsigned .ipa (people sign it themselves
#     with Sideloadly or AltStore and their own Apple ID; see docs/IPHONE.md).
#  3. Self-test in an iPhone 16 Pro simulator: the phone screen comes up, and the phone brain (Qwen3.5 0.8B, pinned
#     like catalog.json) answers one message. A simulator, not a phone: it can't show a real iPhone's memory limit,
#     speed or heat. Screenshots, the .ipa and self-test.json are kept on the run's page.
#  4. On a new version on main (or by hand): waits for the Windows job to publish release vX.Y.Z, then adds
#     Bob-<version>-iphone.ipa and its checksum, like the Android job does with the APK.
# Every action is pinned to a full commit SHA (the tag is in the comment), like build.yml.
name: iPhone app

on:
  push:
    tags: ['v*']
    branches: [main]
  # A draft runs nothing until it is ready for review.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['app/ios/**', 'app/android/app/src/main/cpp/**', 'app/android/app/src/main/assets/www/**', 'app/android/llama.cpp.pin', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to build (default: main)'
        required: false
        default: main

permissions:
  contents: read

jobs:
  ipa:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app/ios
    permissions:
      contents: write # only used by "Add to the GitHub release", on main, version tags and by hand
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tools (XcodeGen)
        run: brew install xcodegen
      - name: Fetch llama.cpp (pinned)
        run: sh ../android/tools/fetch-llama.sh
      - name: Build the brain engine (iPhone and simulator)
        run: ./tools/build-engine.sh
      - name: The phone screen and app icon
        run: ./tools/make-www.sh
      - name: Make the Xcode project
        run: xcodegen generate
      - name: Build for the simulator and for iPhones
        run: |
          v=$(node -p "require('../package.json').version")
          for sdk in iphonesimulator iphoneos; do
            if ! xcodebuild -project Bob.xcodeproj -target Bob -configuration Release -sdk $sdk \
              SYMROOT="$PWD/build/xc" BOB_VERSION="$v" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build > "build/xcodebuild-$sdk.log" 2>&1; then
              grep -E "error:|warning: .*Bob/" -A 3 "build/xcodebuild-$sdk.log" | head -150; tail -30 "build/xcodebuild-$sdk.log"; exit 1
            fi
            test -x "build/xc/Release-$sdk/Bob.app/Bob"
          done
          mkdir -p dist Payload
          cp -R build/xc/Release-iphoneos/Bob.app Payload/
          zip -qry "dist/Bob-$v-iphone.ipa" Payload
          cd dist && shasum -a 256 "Bob-$v-iphone.ipa" | awk '{print $1}' > "Bob-$v-iphone.ipa.sha256" && ls -la
      - name: Self-test in an iPhone 16 Pro simulator
        run: |
          set -e
          mkdir -p shots
          # The test brain: Qwen3.5 0.8B, the exact file catalog.json pins (size and sha256 checked).
          read -r url bytes sha < <(node -e "const c=require('../catalog.json');const m=(c.models||c).find(x=>x.id==='qwen3.5-0.8b');const f=(m.files||[m.file]).find(x=>x.role==='gguf');console.log(f.url,f.bytes,f.sha256)")
          curl -fsSL --retry 3 -o build/test.gguf "$url"
          [ "$(stat -f%z build/test.gguf)" = "$bytes" ] && [ "$(shasum -a 256 build/test.gguf | awk '{print $1}')" = "$sha" ] || { echo "test brain didn't match its pin"; exit 1; }
          DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 16 Pro \(' | grep -oE '[0-9A-F-]{36}' || true)
          [ -n "$DEV" ] || DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b > /dev/null
          xcrun simctl install "$DEV" build/xc/Release-iphonesimulator/Bob.app
          DATA=$(xcrun simctl get_app_container "$DEV" ca.mousewurx.bob data)
          mkdir -p "$DATA/Documents/selftest" && cp build/test.gguf "$DATA/Documents/selftest/"
          xcrun simctl launch "$DEV" ca.mousewurx.bob -BobSelfTest YES
          for i in $(seq 1 90); do
            [ -f "$DATA/Documents/self-test.json" ] && grep -q '"done" : true' "$DATA/Documents/self-test.json" && break
            [ "$i" = 6 ] && xcrun simctl io "$DEV" screenshot shots/1-phone-screen.png
            sleep 5
          done
          xcrun simctl io "$DEV" screenshot shots/2-after-brain.png
          cp "$DATA/Documents/self-test.json" shots/ 2>/dev/null || echo '{"done": false}' > shots/self-test.json
          cat shots/self-test.json
          node -e "
            const r = require('./shots/self-test.json');
            const ok = r.page && r.page.startsWith('object|function|object|compose');
            const b = r.brain || {};
            console.log(ok ? 'PASS the phone screen came up' : 'FAIL the phone screen: ' + r.page);
            const said = b.type === 'done' && /paris/i.test(String(b.text || ''));
            console.log(said ? 'PASS the phone brain answered: ' + b.text + ' (' + (b.tokPerSec || 0).toFixed(1) + ' tokens a second, simulator)' : 'FAIL the phone brain: ' + JSON.stringify(b));
            process.exit(ok && said ? 0 : 1);"
      - name: Keep the .ipa, screenshots and self-test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Bob-iphone-${{ github.sha }}
          path: |
            app/ios/dist/Bob-*-iphone.ipa
            app/ios/dist/Bob-*-iphone.ipa.sha256
            app/ios/shots/
            app/ios/build/xcodebuild-*.log
          if-no-files-found: warn
      - name: Add to the GitHub release
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="v$(node -p "require('../package.json').version")"; fi
          state() { gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" --jq ".[] | select(.tag_name == \"$v\") | if .draft then \"draft\" else \"up\" end" 2>/dev/null | head -1; }
          for i in $(seq 1 90); do s=$(state); [ "$s" = up ] && break; echo "Release $v: ${s:-not there yet}, waiting"; sleep 30; done
          [ "$(state)" = up ] || { echo "Release $v wasn't published in 45 minutes; the .ipa is in this run's artifacts."; exit 0; }
          for try in 1 2 3; do
            gh release upload "$v" dist/Bob-*-iphone.ipa dist/Bob-*-iphone.ipa.sha256 --clobber -R "$GITHUB_REPOSITORY" && exit 0
            echo "Upload failed, trying again in $((try * 30)) seconds"; sleep $((try * 30))
          done
          echo "Couldn't add the .ipa to $v; it's in this run's artifacts."
